<!-- Section 2 : Variantes outlined et filled côte à côte -->
<div class="section-variants">
    <h3>Variantes outlined vs filled</h3>

        <qc-icon icon="info" size="lg" variant="outlined"></qc-icon>
        <qc-icon icon="info" size="lg" variant="filled"></qc-icon>
    </div>
    <div>
        <qc-icon icon="check_circle" size="lg" variant="outlined"></qc-icon>
        <qc-icon icon="check_circle" size="lg" variant="filled"></qc-icon>
    </div>
    <div>
        <qc-icon icon="error" size="lg" variant="outlined"></qc-icon>
        <qc-icon icon="error" size="lg" variant="filled"></qc-icon>
    </div>
    <div>
        <qc-icon icon="warning" size="lg" variant="outlined"></qc-icon>
        <qc-icon icon="warning" size="lg" variant="filled"></qc-icon>
    </div>
</div>

<!-- Section 3 : Couleurs personnalisées -->
